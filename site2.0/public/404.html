<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Redirect to index.html with hash
      const path = window.location.pathname.substring(1);
      if (path) {
        window.location.href = '/#' + path;
      } else {
        window.location.href = '/';
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
